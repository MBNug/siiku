name: Daily Demo Reset

on:
  schedule:
    # 20:00 UTC = 03:00 WIB (Asia/Jakarta)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  reset-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger demo database reset
        env:
          DEMO_RESET_URL: ${{ secrets.DEMO_RESET_URL }}
          DEMO_RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
        run: |
          if [ -z "$DEMO_RESET_URL" ] || [ -z "$DEMO_RESET_TOKEN" ]; then
            echo "::error::Missing DEMO_RESET_URL or DEMO_RESET_TOKEN repository secret."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEMO_RESET_URL" \
            -H "Authorization: Bearer $DEMO_RESET_TOKEN" \
            -H "Accept: application/json" \
            --max-time 180
